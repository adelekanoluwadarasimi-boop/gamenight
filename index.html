<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameNight - Friend's Leaderboard</title>
    <meta name="description" content="Track your game night scores and see who reigns supreme among your friends.">
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <div class="logo-icon">🏆</div>
                <div>
                    <h1>GameNight<span>Leaderboard</span></h1>
                    <div id="backend-status-badge" class="badge-status">⚡ Local Mode</div>
                </div>
            </div>
            <div class="header-right">
                <div class="user-info-section">
                    <div id="user-section" class="user-info">
                        <span id="user-display-name"></span>
                        <button id="auth-btn" class="btn-secondary">Login</button>
                    </div>
                </div>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search games or players...">
                    <span class="search-icon">🔍</span>
                </div>
                <button id="add-score-btn" class="btn-primary" style="display: none;">+ New Score</button>
            </div>
        </header>

        <main>
            <section class="stats-overview">
                <div class="stat-card">
                    <span class="stat-label">Total Games</span>
                    <span class="stat-value" id="total-games">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Top Player</span>
                    <span class="stat-value" id="top-player">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Most Played Game</span>
                    <span class="stat-value" id="most-played">-</span>
                </div>
            </section>

            <section class="leaderboard-section">
                <div class="section-header">
                    <h2>Current Standings</h2>
                </div>
                <div class="leaderboard-card">
                    <table id="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Player</th>
                                <th>Games</th>
                                <th>Total Score</th>
                                <th>Win Rate</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                    <div id="standings-list" class="standings-list">
                        <!-- Populated by JS on mobile -->
                    </div>
                </div>
            </section>

            <section class="recent-history">
                <div class="section-header">
                    <h2>Recent Games</h2>
                    <button id="reset-games-btn" class="btn-secondary" style="display: none; border-color: rgba(239, 68, 68, 0.6); color: #ef4444; font-size: 0.75rem; padding: 0.35rem 0.75rem;">🗑️ Clear All Scores</button>
                </div>
                <div id="games-list" class="games-grid">
                    <!-- Populated by JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Add Score Modal -->
    <div id="score-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Record a Game</h2>
                <button class="close-btn">&times;</button>
            </div>
            <form id="add-score-form">
                <input type="hidden" id="entry-id">
                <div class="form-group">
                    <label for="game-name">Game Name</label>
                    <input type="text" id="game-name" list="game-suggestions" placeholder="Enter game title (e.g. FIFA, Uno, Smash Bros)" required autocomplete="off">
                    <datalist id="game-suggestions">
                        <!-- Populated dynamically from tournament games -->
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="score">Score / Points</label>
                    <input type="number" id="score" placeholder="Points awarded" required>
                </div>
                <div class="form-group">
                    <label for="game-date">Date</label>
                    <input type="date" id="game-date" required>
                </div>
                <div class="form-group">
                    <label for="game-proof">Proof Screenshot (Anti-Cheat)</label>
                    <input type="file" id="game-proof" accept="image/*">
                    <small style="color: var(--text-muted); font-size: 0.7rem;">Upload a screenshot of your win (optional).</small>
                </div>
                <button type="submit" class="btn-submit">Save Result</button>
            </form>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="auth-modal-title">Welcome Back</h2>
                <button class="close-btn" id="close-auth">&times;</button>
            </div>
            <div class="auth-toggle">
                <button id="toggle-login" class="active">Login</button>
                <button id="toggle-signup">Sign Up</button>
            </div>
            <form id="auth-form">
                <div class="form-group" id="signup-name-group" style="display: none;">
                    <label for="signup-name">Account Name</label>
                    <input type="text" id="signup-name" placeholder="Choose a display name">
                </div>
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" placeholder="Enter password" required>
                </div>
                <button type="submit" id="auth-submit-btn" class="btn-submit">Login</button>
            </form>
        </div>
    </div>

    <!-- Image Viewer Modal -->
    <div id="image-viewer-modal" class="modal">
        <div class="modal-content image-modal-content">
            <div class="modal-header">
                <h2 id="image-viewer-title">Proof Screenshot</h2>
                <button class="close-btn close-viewer-btn">&times;</button>
            </div>
            <div class="image-viewer-body">
                <img id="proof-image-full" src="" alt="Proof Screenshot"
                    style="max-width: 100%; height: auto; border-radius: 8px;">
            </div>
        </div>
    </div>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=3"></script>
</body>

</html>
